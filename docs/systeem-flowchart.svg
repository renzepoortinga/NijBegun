<svg viewBox="0 0 900 760" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
<title>Nij Begun &amp; EPA-tool systeemflow</title>
<desc>Van MagicPlan-opname via het canonieke dossier naar twee paden: VABI-import met Standaard-toets, en het Nij Begun isolatieplan met maatregel-advies. Vabi EPA-W is de rekenkern; de tool draait offline.</desc>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0L10 5L0 10z" fill="#64748b"/>
</marker>
<style>
.box{fill:#ffffff;stroke:#94a3b8;stroke-width:1.5;}
.acc{stroke:#2563eb;stroke-width:2.5;}
.t{fill:#0f172a;font-size:15px;font-weight:600;}
.s{fill:#475569;font-size:12px;}
.hdr{fill:#475569;font-size:13px;font-weight:700;letter-spacing:.5px;}
.ln{stroke:#64748b;stroke-width:1.5;fill:none;}
.cap{fill:#475569;font-size:11px;}
</style>
</defs>
<rect x="0" y="0" width="900" height="760" fill="#f8fafc"/>
<rect class="box" x="340" y="22" width="220" height="58" rx="10"/>
<text class="t" x="450" y="46" text-anchor="middle">MagicPlan-opname</text>
<text class="s" x="450" y="66" text-anchor="middle">geometrie (API) + form-PDF</text>
<line class="ln" x1="450" y1="80" x2="450" y2="110" marker-end="url(#ar)"/>
<rect class="box" x="330" y="112" width="240" height="58" rx="10"/>
<text class="t" x="450" y="136" text-anchor="middle">core/dossier.py</text>
<text class="s" x="450" y="156" text-anchor="middle">canoniek datamodel</text>
<path class="ln" d="M450 170 L450 192 L210 192 L210 214" marker-end="url(#ar)"/>
<path class="ln" d="M450 170 L450 192 L690 192 L690 214" marker-end="url(#ar)"/>
<text class="hdr" x="210" y="208" text-anchor="middle">PAD A · ENERGIELABEL / VABI</text>
<rect class="box" x="100" y="216" width="220" height="56" rx="10"/>
<text class="t" x="210" y="239" text-anchor="middle">vabi/generate_all.py</text>
<text class="s" x="210" y="258" text-anchor="middle">3 bibliotheken (XML)</text>
<line class="ln" x1="210" y1="272" x2="210" y2="296" marker-end="url(#ar)"/>
<rect class="box" x="100" y="298" width="220" height="56" rx="10"/>
<text class="t" x="210" y="321" text-anchor="middle">EPA-import</text>
<text class="s" x="210" y="340" text-anchor="middle">Constructies·Objecten·Installaties</text>
<line class="ln" x1="210" y1="354" x2="210" y2="378" marker-end="url(#ar)"/>
<rect class="box acc" x="100" y="380" width="220" height="56" rx="10"/>
<text class="t" x="210" y="403" text-anchor="middle">Vabi EPA-W rekent</text>
<text class="s" x="210" y="422" text-anchor="middle">geattesteerde rekenkern</text>
<line class="ln" x1="210" y1="436" x2="210" y2="460" marker-end="url(#ar)"/>
<rect class="box" x="100" y="462" width="220" height="56" rx="10"/>
<text class="t" x="210" y="485" text-anchor="middle">vabi/result_reader.py</text>
<text class="s" x="210" y="504" text-anchor="middle">Standaard-toets</text>
<text class="hdr" x="690" y="208" text-anchor="middle">PAD B · NIJ BEGUN PLAN</text>
<rect class="box" x="580" y="216" width="220" height="56" rx="10"/>
<text class="t" x="690" y="239" text-anchor="middle">measure_engine</text>
<text class="s" x="690" y="258" text-anchor="middle">goedkoopste pakket → Standaard</text>
<line class="ln" x1="690" y1="272" x2="690" y2="296" marker-end="url(#ar)"/>
<rect class="box" x="580" y="298" width="220" height="56" rx="10"/>
<text class="t" x="690" y="321" text-anchor="middle">engine/advies_text.py</text>
<text class="s" x="690" y="340" text-anchor="middle">begeleidende tekst</text>
<line class="ln" x1="690" y1="354" x2="690" y2="378" marker-end="url(#ar)"/>
<rect class="box" x="580" y="380" width="220" height="56" rx="10"/>
<text class="t" x="690" y="400" text-anchor="middle">isolatieplan-template</text>
<text class="s" x="690" y="419" text-anchor="middle">+ ventilatie + foto + validator</text>
<path class="ln" d="M320 490 L450 490 L450 244 L580 244" marker-end="url(#ar)"/>
<text class="cap" x="455" y="484" text-anchor="start">huidige staat + Standaard-eis →</text>
<rect x="100" y="560" width="700" height="70" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
<text class="t" x="450" y="588" text-anchor="middle">Gouden regel &amp; werkwijze</text>
<text class="cap" x="450" y="610" text-anchor="middle" font-size="12px">Vabi rekent NTA 8800 — de tool levert invoer en leest het resultaat (geen eigen berekening).</text>
<text class="cap" x="450" y="626" text-anchor="middle" font-size="12px">Generators draaien offline (pure Python, geen tokens). VABI-enums afgeleid uit echte export/binary → self-healing.</text>
<text class="cap" x="450" y="675" text-anchor="middle" font-size="11px" font-style="italic">Import-garantie: kloon echte VABI-export als sjabloon + harde validatie-poort (codebook) → nooit "enum mismatch".</text>
</svg>
