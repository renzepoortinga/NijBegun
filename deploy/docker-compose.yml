# nijbegun.poortinga-energieadvies.nl — webapp + Caddy (automatische HTTPS/Let's Encrypt)
# Draaien op de server (vanuit de repo-root):  docker compose -f deploy/docker-compose.yml up -d --build
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    volumes:
      - ../out:/app/out              # projectdata + leads BLIJVEN buiten de container (backup dit pad!)
      - ../config.json:/app/config.json:ro
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
