# nijbegun.poortinga-energieadvies.nl — webapp + Caddy (automatische HTTPS/Let's Encrypt)
# Draaien op de server (vanuit de repo-root):  docker compose -f deploy/docker-compose.yml up -d --build
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    volumes:
      - ../out:/app/out              # projectdata + leads BLIJVEN buiten de container (backup dit pad!)
      # LET OP (15-7, live tegengekomen): dit is een bind-mount van een LOS BESTAND -> die hangt aan het
      # INODE. 'sed -i' schrijft een temp-bestand en hernoemt dat eroverheen = NIEUW inode, dus de
      # container blijft de OUDE config zien (host toonde info@..., container nog renze@... -> bijna 50
      # bewoners het verkeerde adres gemaild). Na ELKE wijziging van config.json op de host:
      #     sudo docker compose -f deploy/docker-compose.yml restart app
      # Verifieer met: ... exec app grep -i email /app/config.json  (de container-view is wat telt).
      - ../config.json:/app/config.json:ro
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
